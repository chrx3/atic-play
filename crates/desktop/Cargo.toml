[package]
name = "ytm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "atic-play"
path = "src/main.rs"

[build-dependencies]
# Embeds the Atic icon in the executable (window, taskbar and Explorer).
embed-resource = "3"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
# Local checkout, so the library can evolve with the app. Switch to `gpui-m3 = "0.1"` to build
# from crates.io.
gpui-m3 = { path = "../gpui-m3" }
# Same versions gpui-m3 uses; the `image` feature extracts the seed color from covers.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
material-colors = { version = "0.4", features = ["image"] }
# The Google sign-in window: a WebView2 with its own profile, whose cookies the app can read
# (Chrome's and Edge's are encrypted for other apps).
tao = "0.37"
wry = "0.57"
ytm-core = { path = "../core" }

# gpui 0.2.2 reaches `xattr` 0.2.3, which uses `libc::ENOATTR`; libc 0.2.190 removed it on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = ">=0.2.150, <0.2.190"
