[workspace]
resolver = "3"
members = [
    "crates/ytmusic",
    "crates/audio",
    "crates/lyrics",
    "crates/app",
    "crates/account",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrx3/atic-play"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "3", features = ["json"] }

# Unoptimized GPUI and audio decoding are very slow: optimize dependencies, keep our crates light.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# TEMPORARY while gpui-m3 changes are in progress: use the local checkout. Remove before pushing.
[patch."https://github.com/chrx3/gpui-m3"]
gpui-m3 = { path = "C:/Users/Christian/OneDrive - The Synergy Group SPA/Documentos/gpui-m3" }
